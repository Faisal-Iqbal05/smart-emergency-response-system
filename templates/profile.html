{% extends 'base.html' %}{% block title %}Profile — NeighbourAid{% endblock %}{% block content %}<section class="form-card"><h1>Your profile</h1><form method="post">{% csrf_token %}<label>First name<input name="first_name" value="{{ user.first_name }}"></label><label>Last name<input name="last_name" value="{{ user.last_name }}"></label><label>Email<input value="{{ user.email }}" disabled></label><label>Phone<input type="tel" name="phone" value="{{ user.phone }}"></label><label>Locality<input name="locality" value="{{ user.locality }}"></label><label>Preferred language<input name="preferred_language" value="{{ user.preferred_language }}"></label><button class="button">Save profile</button></form><p><a href="{% url 'password_change' %}">Change password</a></p></section>{% endblock %}
